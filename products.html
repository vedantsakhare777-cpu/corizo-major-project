<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | VERISE</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<section class="section page-top"><div class="container">
  <div class="head">
    <div><h2 id="shopTitle">All Products</h2><p>Browse everything on VERISE.</p></div>
    <a id="clearQ" href="products.html" hidden>Clear search</a>
  </div>
  <div class="chips" id="chips"></div>
  <div class="toolbar">
    <span class="count" id="shopCount"></span>
    <select id="sort" onchange="renderShop()" aria-label="Sort products">
      <option value="featured">Featured</option>
      <option value="low">Price: low to high</option>
      <option value="high">Price: high to low</option>
      <option value="rating">Top rated</option>
    </select>
  </div>
  <div class="grid" id="shopGrid"></div>
</div></section>
<div id="footer"></div>
<script src="js/app.js"></script>
</body>
</html>
